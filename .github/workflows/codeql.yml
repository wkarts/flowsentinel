name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    name: Análise C#
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FlowSentinel.sln
      - run: dotnet build FlowSentinel.sln -c Release --no-restore
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
